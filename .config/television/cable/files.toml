[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["fd", "bat"]

[source]
command = "fd -t f"

[preview]
command = "batcat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
shortcut = "f1"
enter = "actions:edit"

[actions.edit]
description = "Opens the selected entries with the default editor"
command = "nvim '{}'"
shell = "zsh"
mode = "execute"
